imageio = "==2.27.0"
adbutils = "==0.11.0"
uiautomator2 = "==2.16.17"
uiautomator2cache = "==0.3.0.1"
wrapt = "==1.13.1"
retrying = "*"
lz4 = "*"
av = "*"
psutil = "==5.9.3"
rich = "==11.2.0"
tqdm = "*"
jellyfish = "==0.11.2"
pyyaml = "*"
inflection = "*"
pydantic = "*"
aiofiles = "*"
prettytable = "==2.2.1"
anyio = "==1.3.1"
onepush = "==1.4.0"
pycryptodome = "==3.9.9"
pypresence = "==4.2.1"
