[workspace]
channels = ["conda-forge"]
name = "alas"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
start = "python gui.py"

[dependencies]
libglib = "*"
libgomp = "*"
libgl = "*"
xorg-libsm = "*"
xorg-libxrender = "*"
xorg-libxext = "*"
python = ">=3.8,<3.9"
av = ">=10,<11"
numpy = ">=1.24.4,<1.25"
scipy = ">=1.10.1,<1.11"
pillow = ">=10.4,<11"
opencv = ">=4.8,<5"
imageio = ">=2.31,<3"
wrapt = ">=1.16,<2"
retrying = "==1.3.3"
lz4 = ">=4.3,<5"
psutil = ">=5.9.8,<7"
rich = ">=13.7,<14"
tqdm = ">=4.66,<5"
pyyaml = ">=6.0.1,<7"
inflection = ">=0.5.1,<1"
prettytable = ">=3.10,<4"
pycryptodome = ">=3.20,<4"
starlette = ">=0.27,<0.28"
pyzmq = ">=25.1,<26"
aiofiles = ">=23.2,<24"
uvicorn = ">=0.23,<0.24"
httptools = ">=0.6,<0.7"
uvloop = ">=0.19,<0.20"
websockets = ">=11,<12"
h11 = ">=0.14,<0.15"
python-dotenv = ">=1.0,<2"
requests = ">=2.31,<3"

[pypi-dependencies]
anyio = ">=3.7,<4"
adbutils = ">=1.2,<2"
uiautomator2 = ">=2.16.25,<3"
uiautomator2cache = "==0.3.0.1"
onepush = ">=1.4,<2"
pypresence = ">=4.2.1,<5"
cnocr = ">=1.2,<2"
mxnet-alas = "*"
jellyfish = ">=0.11.2,<1"
pydantic = ">=1.10.15,<2"
pywebio = ">=1.8.4,<2"
zerorpc = "==0.6.3"
alas-webapp = "==0.3.7"