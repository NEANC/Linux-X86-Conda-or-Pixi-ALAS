[workspace]
channels = ["conda-forge"]
name = "alas"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
start = "python gui.py"

[dependencies]
libglib = "*"
libgomp = "*"
libgl = "*"
xorg-libsm = "*"
xorg-libxrender = "*"
xorg-libxext = "*"
python = "==3.8.10"
av = ">=8.0.3,<11"
numpy = "==1.24.4"
scipy = ">=1.10,<1.11"
pillow = "*"
packaging = ">=20.3,<21"
pyzmq = "*"

[pypi-dependencies]
opencv-python = "*"
imageio = "==2.27.0"
adbutils = "==0.11.0"
uiautomator2 = "==2.16.17"
uiautomator2cache = "==0.3.0.1"
wrapt = "==1.13.1"
retrying = "*"
lz4 = "*"
psutil = "==5.9.3"
rich = "==11.2.0"
tqdm = "*"
jellyfish = "==0.11.2"
pyyaml = "*"
inflection = "*"
pydantic = "*"
aiofiles = "*"
prettytable = "==2.2.1"
anyio = "==1.3.1"
onepush = "==1.4.0"
pycryptodome = "==3.9.9"
pypresence = "==4.2.1"
cnocr = ">=1.2.2,<2"
mxnet-alas = "*"
pywebio = "==1.6.2"
starlette = "==0.14.2"
uvicorn = { version = "==0.17.6", extras = ["standard"] }
alas-webapp = "==0.3.7"
zerorpc = "==0.6.3"