[workspace]
channels = ["conda-forge"]
name = "alas"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
start = "python gui.py"

[dependencies]
python = "==3.7.6"
av = ">=8.0.3,<9"

[pypi-dependencies]
numpy = "==1.21.6"
scipy = "==1.4.1"
