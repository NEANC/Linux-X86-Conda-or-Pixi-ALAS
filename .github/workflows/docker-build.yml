name: Docker 构建与发布

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Docker/**"
      - "Pixi/pixi.toml"
      - ".github/workflows/docker-build.yml"
      - "!Docker/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/alas-pixi-alpine
  ARTIFACT_NAME: alas-pixi-image.tar.gz
  IMAGE_TAG: alas-pixi-alpine:ci-test

jobs:
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 压扁镜像为单层
        run: |
          set -eu

          echo "========== 导出镜像 rootfs =========="
          docker create --name flat-tmp ${{ env.IMAGE_TAG }}
          docker export flat-tmp -o /tmp/alas-rootfs.tar
          docker rm flat-tmp

          _size_raw=$(stat -c '%s' /tmp/alas-rootfs.tar 2>/dev/null || echo "?")
          _size_human=$(numfmt --to=iec --suffix=B "${_size_raw}" 2>/dev/null || echo "${_size_raw} bytes")
          echo "rootfs tar 大小: ${_size_human}"

          echo ""
          echo "========== 导入为压扁镜像 =========="
          docker import /tmp/alas-rootfs.tar alas-pixi-alpine:flat-rootfs
          rm -f /tmp/alas-rootfs.tar

          echo ""
          echo "========== 注入容器元数据 =========="
          docker build -f Docker/Dockerfile.flat \
            --build-arg FLAT_BASE=alas-pixi-alpine:flat-rootfs \
            -t ${{ env.IMAGE_TAG }} .

          echo ""
          echo "========== 镜像对比 =========="
          docker images --filter reference='alas-pixi-alpine:*' \
            --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}"

      - name: 导出镜像为产物
        run: |
          set -eu
          echo "========== 导出压扁镜像 =========="
          docker save ${{ env.IMAGE_TAG }} | gzip > "${{ env.ARTIFACT_NAME }}"

          _size_gz=$(stat -c '%s' "${{ env.ARTIFACT_NAME }}" 2>/dev/null || echo "?")
          _size_human=$(numfmt --to=iec --suffix=B "${_size_gz}" 2>/dev/null || echo "${_size_gz} bytes")
          echo "gzip 产物大小: ${_size_human}"

      - name: 上传镜像产物
        uses: actions/upload-artifact@v7
        with:
          name: alas-pixi-image
          path: ${{ env.ARTIFACT_NAME }}
          retention-days: 1

  test:
    name: 镜像测试
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 下载镜像产物
        uses: actions/download-artifact@v8
        with:
          name: alas-pixi-image

      - name: 加载镜像
        run: |
          set -eu
          gunzip -c "${{ env.ARTIFACT_NAME }}" | docker load
          docker images --filter reference='alas-pixi-alpine:*'

      - name: 克隆 ALAS 仓库
        uses: actions/checkout@v6
        with:
          repository: LmeSzinc/AzurLaneAutoScript
          path: AzurLaneAutoScript

      - name: 启动容器并运行测试
        env:
          ALAS_REPO_PATH: ${{ github.workspace }}/AzurLaneAutoScript
          ALAS_TEST_IMAGE: ${{ env.IMAGE_TAG }}
        run: |
          set -eu

          echo "========== 启动测试容器 =========="
          docker compose -f Docker/docker-compose.test.yml up -d

          echo ""
          echo "等待 Pixi 环境部署与 ALAS 启动..."
          sleep 45

          echo ""
          echo "========== 容器状态 =========="
          docker ps -a --filter name=alas-test \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo ""
          echo "========== 容器日志 =========="
          docker logs alas-test 2>&1

          echo ""
          if docker ps --filter name=alas-test --format '{{.Names}}' | grep -q alas-test; then
            echo "========== ✅ 容器运行正常，测试通过 =========="
          else
            echo "========== ❌ 容器已退出，测试失败 =========="
            exit 1
          fi

      - name: 清理测试资源
        if: always()
        run: |
          docker compose -f Docker/docker-compose.test.yml down -v 2>/dev/null || true
          docker rm -f alas-test 2>/dev/null || true

  publish:
    name: 发布镜像
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}

      - name: 下载镜像产物
        uses: actions/download-artifact@v8
        with:
          name: alas-pixi-image

      - name: 加载镜像
        run: |
          set -eu
          gunzip -c "${{ env.ARTIFACT_NAME }}" | docker load
          docker images --filter reference='alas-pixi-alpine:*'

      - name: 推送镜像到 Registry
        run: |
          set -eu

          echo "========== 推送压扁镜像 =========="
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            _tag=$(echo "${tag}" | xargs)
            echo "  打标签并推送: ${_tag}"
            docker tag ${{ env.IMAGE_TAG }} "${_tag}"
            docker push "${_tag}"
          done
