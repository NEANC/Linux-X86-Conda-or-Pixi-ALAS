name: Docker 构建与发布

on:
  push:
    branches: [master]
    paths:
      - "docker/**"
      - "Pixi/pixi.toml"
      - ".github/workflows/docker-build.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "docker/**"
      - "Pixi/pixi.toml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/alas-pixi-alpine

jobs:
  build-and-test:
    name: 构建、压扁、测试并发布
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: alas-pixi-alpine:ci-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 压扁镜像为单层
        run: |
          set -eu

          echo "========== 导出镜像 rootfs =========="
          docker create --name flat-tmp alas-pixi-alpine:ci-build
          docker export flat-tmp -o /tmp/alas-rootfs.tar
          docker rm flat-tmp

          _size_raw=$(stat -c '%s' /tmp/alas-rootfs.tar 2>/dev/null || echo "?")
          echo "rootfs tar 大小: ${_size_raw} bytes"

          echo ""
          echo "========== 导入为压扁镜像 =========="
          docker import /tmp/alas-rootfs.tar alas-pixi-alpine:flat-rootfs
          rm -f /tmp/alas-rootfs.tar

          echo ""
          echo "========== 注入容器元数据 =========="
          docker build -f docker/Dockerfile.flat \
            --build-arg FLAT_BASE=alas-pixi-alpine:flat-rootfs \
            -t alas-pixi-alpine:ci-test .

          echo ""
          echo "========== 镜像对比 =========="
          docker images --filter reference='alas-pixi-alpine:*' \
            --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}"

      - name: 克隆 ALAS 仓库
        uses: actions/checkout@v6
        with:
          repository: LmeSzinc/AzurLaneAutoScript
          path: AzurLaneAutoScript

      - name: 启动容器并运行测试
        env:
          ALAS_REPO_PATH: ${{ github.workspace }}/AzurLaneAutoScript
          ALAS_TEST_IMAGE: alas-pixi-alpine:ci-test
        run: |
          set -eu

          echo "========== 启动测试容器 =========="
          docker compose -f docker/docker-compose.test.yml up -d

          echo ""
          echo "等待 Pixi 环境部署与 ALAS 启动..."
          sleep 45

          echo ""
          echo "========== 容器状态 =========="
          docker ps -a --filter name=alas-test \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo ""
          echo "========== 容器日志 =========="
          docker logs alas-test 2>&1

          echo ""
          if docker ps --filter name=alas-test --format '{{.Names}}' | grep -q alas-test; then
            echo "========== ✅ 容器运行正常，测试通过 =========="
          else
            echo "========== ❌ 容器已退出，测试失败 =========="
            exit 1
          fi

      - name: 清理测试资源
        if: always()
        run: |
          docker compose -f docker/docker-compose.test.yml down -v 2>/dev/null || true
          docker rm -f alas-test 2>/dev/null || true

      - name: 保存压扁镜像为 gzip 产物
        if: github.event_name != 'pull_request'
        run: |
          set -eu

          _short_sha=$(git rev-parse --short HEAD)
          _artifact="alas-pixi-alpine-${_short_sha}.tar.gz"

          echo "========== 导出压扁镜像 → ${_artifact} =========="
          docker save alas-pixi-alpine:ci-test | gzip > "${_artifact}"

          _size_gz=$(stat -c '%s' "${_artifact}" 2>/dev/null || echo "?")
          echo "gzip 产物大小: ${_size_gz} bytes"

          echo "artifact_path=${_artifact}" >> $GITHUB_ENV

      - name: 上传 Gzip 产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: alas-pixi-alpine-flat
          path: ${{ env.artifact_path }}
          retention-days: 7

      - name: 推送压扁镜像到 Registry
        if: github.event_name != 'pull_request'
        run: |
          set -eu

          echo "========== 推送压扁镜像 =========="
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            _tag=$(echo "${tag}" | xargs)
            echo "  打标签并推送: ${_tag}"
            docker tag alas-pixi-alpine:ci-test "${_tag}"
            docker push "${_tag}"
          done
