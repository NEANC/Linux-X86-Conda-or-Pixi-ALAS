name: 自动测试

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - "Shell/**"
  pull_request:
    paths:
      - "Shell/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux 部署测试
  deploy-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Conda Ubuntu",  script: conda_alas_install.sh,  flags: "--debug",  verify: environment.yml }
          - { name: "Pixi Ubuntu",   script: pixi_alas_install.sh,   flags: "--debug",  verify: pixi.toml }

    steps:
      - uses: actions/checkout@v6
      #- name: Install pre-reqs
      #  run: sudo apt-get update -qq && sudo apt-get install -y -qq git adb
      - name: Run deployment
        run: sudo bash Shell/${{ matrix.script }} ${{ matrix.flags }} 2>&1
      - name: Stop systemd & start ALAS manually (head 150)
        if: always()
        run: |
          echo "=== Stopping systemd service ==="
          sudo systemctl stop run_alas.service 2>&1 || true
          echo ""
          echo "=== Starting ALAS manually ==="
          ALAS_DIR="$HOME/AzurLaneAutoScript"
          if [ -d "$ALAS_DIR" ] && [ -f "$ALAS_DIR/run_alas.sh" ]; then
            bash "$ALAS_DIR/run_alas.sh" > /tmp/alas_run.log 2>&1 &
            ALAS_PID=$!
            echo "ALAS PID: $ALAS_PID (${ALAS_DIR})"
            sleep 20
            kill $ALAS_PID 2>/dev/null || true
            wait $ALAS_PID 2>/dev/null || true
            echo "=== ALAS output (first 150 lines) ==="
            head -150 /tmp/alas_run.log 2>&1 || true
            rm -f /tmp/alas_run.log
          else
            echo "SKIP: ALAS directory not found at ${ALAS_DIR} (deploy may have failed)"
          fi
      - name: Uninstall
        if: always()
        run: sudo bash Shell/${{ matrix.script }} --debug --uninstall -y 2>&1

  # macOS 部署测试
  deploy-macos:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Conda macOS",  script: arm_mac_conda_alas_install.sh,  flags: "--debug",  verify: environment.yml }
          - { name: "Pixi macOS",   script: arm_mac_pixi_alas_install.sh,   flags: "--debug",  verify: pixi.toml }
    steps:
      - uses: actions/checkout@v6
      - name: Run deployment
        run: bash Shell/${{ matrix.script }} ${{ matrix.flags }} 2>&1
      - name: Stop launchctl & start ALAS manually (head 150)
        if: always()
        run: |
          echo "=== Stopping launchctl service ==="
          launchctl stop com.alas.run 2>&1 || true
          echo ""
          echo "=== Starting ALAS manually ==="
          ALAS_DIR="$HOME/AzurLaneAutoScript"
          if [ -d "$ALAS_DIR" ] && [ -f "$ALAS_DIR/run_alas.sh" ]; then
            bash "$ALAS_DIR/run_alas.sh" > /tmp/alas_run.log 2>&1 &
            ALAS_PID=$!
            echo "ALAS PID: $ALAS_PID (${ALAS_DIR})"
            sleep 20
            kill $ALAS_PID 2>/dev/null || true
            wait $ALAS_PID 2>/dev/null || true
            echo "=== ALAS output (first 150 lines) ==="
            head -150 /tmp/alas_run.log 2>&1 || true
            rm -f /tmp/alas_run.log
          else
            echo "SKIP: ALAS directory not found at ${ALAS_DIR} (deploy may have failed)"
          fi
      - name: Uninstall
        if: always()
        run: bash Shell/${{ matrix.script }} --debug --uninstall -y 2>&1
