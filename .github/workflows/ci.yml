name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux 部署测试
  deploy-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Conda",  script: conda_alas_install.sh,  flags: "--debug",   verify: environment.yml }
          - { name: "Pixi",  script: pixi_alas_install.sh,   flags: "--debug",   verify: pixi.toml }

    steps:
      - uses: actions/checkout@v6
      - name: Install pre-reqs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq git adb
      - name: Run deployment
        run: sudo bash Shell/${{ matrix.script }} ${{ matrix.flags }} 2>&1
      - name: Verify output
        run: |
          test -d "$HOME/AzurLaneAutoScript" || { echo "ERROR: ALAS dir missing"; exit 1; }
          test -f "$HOME/AzurLaneAutoScript/${{ matrix.verify }}" || { echo "ERROR: ${{ matrix.verify }} missing"; exit 1; }
          echo "All output files verified"
      - name: Uninstall
        if: always()
        run: echo "yes" | sudo bash Shell/${{ matrix.script }} --uninstall -y 2>&1

  # macOS 部署测试
  deploy-macos:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Conda",  script: arm_mac_conda_alas_install.sh,  flags: "--debug",   verify: environment.yml }
          - { name: "Pixi",  script: arm_mac_pixi_alas_install.sh,   flags: "--debug",   verify: pixi.toml }
    steps:
      - uses: actions/checkout@v6
      - name: Run deployment
        run: bash Shell/${{ matrix.script }} ${{ matrix.flags }} 2>&1
      - name: Verify output
        run: |
          test -d "$HOME/AzurLaneAutoScript" || { echo "ERROR: ALAS dir missing"; exit 1; }
          test -f "$HOME/AzurLaneAutoScript/${{ matrix.verify }}" || { echo "ERROR: ${{ matrix.verify }} missing"; exit 1; }
          echo "All output files verified"
      - name: Uninstall
        if: always()
        run: echo "yes" | bash Shell/${{ matrix.script }} --uninstall -y 2>&1
