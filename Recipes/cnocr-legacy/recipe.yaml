package:
  name: cnocr
  version: 1.2.3.1

source:
  url: https://files.pythonhosted.org/packages/source/c/cnocr/cnocr-1.2.3.1.tar.gz
  sha256: bd01402cc5c9a432f246e78efc107ea31e7099b9ee1b304937c83e5f97c03b07

build:
  number: 0
  script: |
    set -eux
    "$PYTHON" -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python ==3.7.6
    - pip
    - setuptools
  run:
    - python >=3.7,<3.8
    - numpy >=1.21,<2
    - pillow
    - mxnet ==1.6.0

tests:
  - script:
      - python - <<'PY'
        import cnocr
        from cnocr import CnOcr
        print("cnocr import OK")
        PY
