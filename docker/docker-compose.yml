services:
  alas:
    image: ghcr.io/neanc/alas-pixi-alpine:latest
    container_name: alas
    restart: unless-stopped

    environment:
      - ALAS_DIR=/AzurLaneAutoScript
      - DEPLOY_TEMPLATE=config/deploy.template-linux.yaml

      # 代理配置，不配置则直连
      # - HTTP_PROXY=http://proxy:8080
      # - HTTPS_PROXY=http://proxy:8080
      # - NO_PROXY=localhost,127.0.0.1

    volumes:
      # 将宿主机上的 AzurLaneAutoScript 目录挂载到容器内
      # 请将左侧路径替换为实际的 ALAS 仓库路径
      - ./AzurLaneAutoScript:/AzurLaneAutoScript

      # 可选: 分离 Pixi 虚拟环境到独立卷（避免 .pixi 写入 ALAS 仓库）
      # 启用时删除上面 /AzurLaneAutoScript 行中的 .pixi 覆盖，并取消下面注释：
      # - alas-pixi-env:/AzurLaneAutoScript/.pixi

    ports:
      - "22267:22267"

    # 可选: 传递 USB 设备以连接安卓模拟器/手机
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

    # 可选: privileged 模式（某些 ADB 场景需要）
    # privileged: true

# 可选: 分离的 Pixi 环境卷
# volumes:
#   alas-pixi-env:
#     driver: local
